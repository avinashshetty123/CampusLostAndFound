name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/demo
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_URI: mongodb://localhost:27017/laf_ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Docker image builds (same as Render)
        run: docker build -t campus-laf-api .

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LostAndFound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: LostAndFound/app/build/outputs/apk/debug/app-debug.apk
