spring.application.name=campus-lost-and-found

# ── MongoDB Atlas ─────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI}
# Needed so @Indexed(unique = true) on User.email is actually created
spring.data.mongodb.auto-index-creation=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# Must be at least 32 characters (HS256)
jwt.secret=${JWT_SECRET}
# Default: 7 days
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# ── Cloudinary (optional — image uploads are disabled when unset) ─────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ── Server ────────────────────────────────────────────────────────────────────
# Render injects PORT; 8000 is the local default the Android emulator expects
server.port=${PORT:8000}
server.servlet.context-path=/api
server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true
server.error.include-stacktrace=never

# ── Health check (Render: /api/actuator/health) ───────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
